name: Construir APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar ALTEA Salud
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ALTEA-Salud-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
