name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descomprimir el zip
        run: |
          rm -rf _src && mkdir _src
          unzip -q -o ./*.zip -d _src
          DIR=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "PROYECTO=$DIR" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar la app
        working-directory: ${{ env.PROYECTO }}
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: ALTEA-apk
          path: ${{ env.PROYECTO }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ALTEA v${{ github.run_number }}
          files: ${{ env.PROYECTO }}/app/build/outputs/apk/debug/app-debug.apk
